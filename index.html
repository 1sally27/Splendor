<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>스플렌더 AI 대전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: sky-blue table. Left stage = top message bar, 3 card rows + token column + noble column, my tray at bottom. Right rail = players + log. */
:root{
  --sky-1:#0a2140; --sky-2:#15497a; --sky-3:#3a82b0; --sky-4:#68a6c8;
  --paper:#f6f3ea; --ink:#0f1b2b; --ink-soft:#4a5a70;
  --gold:#f2c14e; --gold-deep:#a97a12;
  --glass:rgba(255,255,255,.13); --glass-line:rgba(255,255,255,.28); --glass-dark:rgba(6,20,40,.5);
  --g0:#eef2f7; --g1:#2467d6; --g2:#1f9e58; --g3:#d02a36; --g4:#23252d; --g5:#e7b72c;
  --good:#58d68d; --bad:#ff7a7a;
  --font-ui:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-disp:'Cinzel','Times New Roman',serif;
  --cw:clamp(60px,min(7.3vw,11vh),120px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky-1);color:#fff;font-family:var(--font-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 34%,var(--sky-3) 70%,var(--sky-4) 100%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- gems ---------- */
.gem{width:1em;height:1em;display:inline-block;vertical-align:-.12em}
.c0{color:var(--g0)}.c1{color:var(--g1)}.c2{color:var(--g2)}.c3{color:var(--g3)}.c4{color:var(--g4)}.c5{color:var(--g5)}
.chip{position:relative;display:inline-grid;place-items:center;width:2em;height:2em;flex:none}
.chip svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.chip b{position:relative;font-weight:800;font-size:.95em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);line-height:1}
.chip.c0 b,.chip.c5 b{color:#14202e;text-shadow:none}
.ic{display:inline-flex;gap:1px;vertical-align:middle}
.ic svg{width:1.25em;height:1.25em;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}

/* ---------- app frame ---------- */
#app{min-height:100%}
.game{display:grid;gap:12px;padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "players" "nobles" "board" "tokens" "me" "log"}
.top{grid-area:top;background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:700;text-align:center;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.top .name{color:#a8321f}
.top .tag{font-size:12px;background:var(--ink);color:var(--gold);border-radius:99px;padding:3px 10px;font-weight:700}
.top .menu{margin-left:auto;display:flex;gap:6px}
.top .menu button{background:transparent;border:1px solid #b9b3a3;border-radius:8px;color:var(--ink);padding:4px 10px;font-size:13px}
.top.mine{background:#fff7d6}

@media (min-width:1000px) and (min-height:620px){
  html,body{overflow:hidden}
  #app{height:100%}
  .game{height:100%;grid-template-columns:minmax(0,1fr) 290px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top players" "board players" "me log";gap:10px 14px;padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
  .stagewrap{display:contents}
}

/* ---------- board ---------- */
.boardarea{grid-area:board;display:grid;gap:12px;align-items:start;justify-content:center;grid-template-columns:minmax(0,1fr);min-height:0}
@media (min-width:1000px){.boardarea{grid-template-columns:auto calc(var(--cw)*.78) auto;align-items:center;gap:clamp(12px,3vw,48px);justify-content:center}}
.rows{display:grid;gap:calc(var(--cw)*.12)}
.row{display:grid;grid-template-columns:repeat(5,var(--cw));gap:calc(var(--cw)*.12)}
@media (max-width:999px){:root{--cw:calc((100vw - 32px - 40px)/5)}.rows,.row{justify-content:center}}
.cell{width:var(--cw);height:calc(var(--cw)*1.33);position:relative}
.card{--f:max(8.5px,calc(var(--cw)*.125));position:relative;width:100%;height:100%;border-radius:calc(var(--cw)*.07);border:2px solid rgba(255,255,255,.85);overflow:hidden;background-size:100% 100%;background-position:center;padding:0;box-shadow:0 3px 8px rgba(0,0,0,.4);font-size:var(--f);display:block;text-align:left;transition:transform .12s}
.card:not(.dead):hover{transform:translateY(-3px)}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.4))}
.card .pts{position:absolute;left:.45em;top:.05em;font-family:var(--font-disp);font-weight:800;font-size:2.1em;line-height:1.1;color:#fff;text-shadow:0 0 3px #000,0 1px 3px #000}
.card .bon{position:absolute;right:.4em;top:.4em;width:2.35em;height:2.35em;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.card .bon .gem{font-size:1.6em}
.card .costs{position:absolute;left:.3em;bottom:.3em;display:flex;flex-direction:column-reverse;gap:.1em;font-size:.88em}
.card.can{box-shadow:0 0 0 3px var(--good),0 3px 8px rgba(0,0,0,.4)}
.card.res{box-shadow:0 0 0 3px var(--gold),0 3px 8px rgba(0,0,0,.4)}
.card.empty{background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.3);box-shadow:none}
.deck{--f:max(8.5px,calc(var(--cw)*.125));width:100%;height:100%;border-radius:calc(var(--cw)*.07);border:2px solid rgba(255,255,255,.85);position:relative;display:grid;place-items:center;font-size:var(--f);box-shadow:0 3px 8px rgba(0,0,0,.4);padding:0;overflow:hidden}
.deck.l1{background:linear-gradient(160deg,#3fae63,#0f5d2e)}
.deck.l2{background:linear-gradient(160deg,#e6b43a,#8a5a07)}
.deck.l3{background:linear-gradient(160deg,#3b6fd0,#142e70)}
.deck .title{font-family:var(--font-disp);font-weight:800;font-size:1.35em;color:var(--gold);text-shadow:0 0 3px #000,0 2px 2px #000;letter-spacing:.02em}
.deck .dots{position:absolute;bottom:.6em;left:0;right:0;display:flex;justify-content:center;gap:.35em}
.deck .dots i{width:.55em;height:.55em;border-radius:50%;background:#fff;opacity:.9}
.deck .cnt{position:absolute;left:.3em;top:.3em;background:#fff;color:var(--ink);font-weight:800;border-radius:99px;min-width:1.9em;height:1.9em;display:grid;place-items:center;font-size:.95em;border:2px solid var(--ink)}
.deck.can{cursor:pointer}.deck.can:hover{filter:brightness(1.12)}
.deck.none{opacity:.35}

/* tokens column */
.tokens{display:flex;gap:calc(var(--cw)*.14);justify-content:center;flex-wrap:wrap}
@media (min-width:1000px){.tokens{flex-direction:column;flex-wrap:nowrap;align-items:center}}
.pile{position:relative;width:calc(var(--cw)*.62);height:calc(var(--cw)*.62);min-width:46px;min-height:46px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),rgba(255,255,255,0) 45%),currentColor;box-shadow:0 0 0 3px rgba(255,255,255,.75),0 4px 8px rgba(0,0,0,.45),inset 0 -4px 0 rgba(0,0,0,.25)}
.pile .gem{width:58%;height:58%;color:inherit}
.pile .gem{filter:none}
.pile .inner{position:absolute;inset:18%;border-radius:50%;background:rgba(0,0,0,.18);display:grid;place-items:center}
.pile .glyph{width:70%;height:70%}
.pile .n{position:absolute;left:-.3em;top:-.3em;background:#fff;color:var(--ink);border:2px solid var(--ink);font-weight:800;font-size:12px;min-width:22px;height:22px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.pile .sel{position:absolute;right:-.45em;bottom:-.3em;background:var(--gold);color:var(--ink);font-weight:800;font-size:12px;min-width:22px;height:22px;border-radius:99px;display:grid;place-items:center;border:2px solid var(--ink);padding:0 4px}
.pile.off{opacity:.45;cursor:default}
.pile{background-color:#fff}
.pile.on{box-shadow:0 0 0 4px var(--gold),0 4px 8px rgba(0,0,0,.45),inset 0 -4px 0 rgba(0,0,0,.25);transform:translateY(-3px)}
.pile.pc0,.pile.pc5{--ic:#14202e}
.pile .glyphwrap{display:grid;place-items:center;width:62%;height:62%}

/* nobles */
.nobles{display:flex;gap:calc(var(--cw)*.14);justify-content:center;flex-wrap:wrap}
@media (min-width:1000px){.nobles{flex-direction:column;flex-wrap:nowrap}}
.noble{--nf:max(8.5px,calc(var(--cw)*.115));position:relative;width:calc(var(--cw)*.92);height:calc(var(--cw)*.92);border-radius:calc(var(--cw)*.06);border:2px solid rgba(255,255,255,.85);overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.4);font-size:var(--nf);flex:none;padding:0;display:block;text-align:left}
.noble svg.port{position:absolute;inset:0;width:100%;height:100%}
.noble .port{position:absolute;inset:0;background-size:100% 100%;background-position:center}
.noble .pts,.noble .req{z-index:1}
.noble .pts{position:absolute;left:.4em;top:.05em;font-family:var(--font-disp);font-weight:800;font-size:2em;line-height:1.1;text-shadow:0 0 3px #000,0 1px 3px #000}
.noble .req{position:absolute;right:.25em;bottom:.25em;display:flex;flex-direction:column;gap:.1em}
.noble .req .chip{font-size:.95em}
.noble.can{box-shadow:0 0 0 3px var(--good),0 3px 8px rgba(0,0,0,.4)}
.noble.mini{--cw:48px;width:56px;height:56px}
.sectitle{font-size:12px;opacity:.85}

/* ---------- me ---------- */
.me{grid-area:me;display:grid;gap:12px;align-items:end;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.me{grid-template-columns:auto minmax(0,1fr) auto;gap:14px}}
.box{position:relative;border:2px solid var(--gold);border-radius:12px;background:rgba(10,33,64,.45);padding:16px 12px 10px;min-height:60px}
.box > .lab{position:absolute;top:-13px;left:14px;background:var(--glass-dark);backdrop-filter:blur(2px);border:2px solid var(--gold);border-radius:99px;padding:1px 12px;font-size:13px;font-weight:700;color:#fff}
.box > .lab.r{left:auto;right:14px}
.mygems{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;justify-content:center}
.slot{--sf:14px;width:58px;border-radius:9px;display:grid;grid-template-rows:auto auto;place-items:center;padding:6px 0 4px;font-size:var(--sf);border:2px solid rgba(255,255,255,.7);position:relative}
.slot.s0{background:#f4f6fa;color:#14202e}.slot.s1{background:#1f4fc0}.slot.s2{background:#168a49}.slot.s3{background:#a31622}.slot.s4{background:#14151a}.slot.s5{background:#c79a1d;color:#14202e}
.slot .tk{font-weight:800;font-size:1.5em;line-height:1}
.slot .bn{font-size:.78em;font-weight:700;opacity:.95;display:flex;align-items:center;gap:2px;margin-top:3px}
.slot .gem{font-size:1.1em}
.slot.s0 .gem,.slot.s5 .gem{filter:none}
.trayinfo{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px;min-height:36px}
.btn{border:0;border-radius:9px;padding:8px 14px;font-weight:700;font-size:14px;background:var(--gold);color:var(--ink);box-shadow:0 2px 0 var(--gold-deep)}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff;box-shadow:none;border:1px solid var(--glass-line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13px;opacity:.92}
.reserved{display:flex;gap:8px;flex-wrap:wrap;min-height:calc(var(--cw)*.9)}
.reserved .cell{--cw:62px;width:62px;height:82px}
.reserved .cell .card{--f:10px}
.reserved .ph{font-size:12px;opacity:.7;align-self:center}
.mynobles{display:flex;gap:6px;flex-wrap:wrap;min-width:90px}

/* ---------- players rail ---------- */
.players{grid-area:players;display:grid;gap:10px;align-content:start;min-height:0;overflow:auto}
@media (max-width:999px){.players{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}}
.pp{background:var(--glass-dark);border:2px solid transparent;border-radius:14px;padding:10px;display:grid;gap:8px;position:relative}
.pp.turn{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.25)}
.pp .hd{display:flex;align-items:center;gap:8px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;border:2px solid rgba(255,255,255,.8);flex:none}
.pp .nm{background:#fff;color:var(--ink);font-weight:700;font-size:13px;border-radius:99px;padding:2px 10px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp .ai{font-size:10px;font-weight:700;background:var(--ink);border:1px solid var(--glass-line);border-radius:6px;padding:1px 5px;margin-left:2px}
.pp .sc{margin-left:auto;font-weight:800;display:flex;align-items:center;gap:4px;font-size:16px}
.pp .sc i{color:var(--gold);font-style:normal}
.pp .cols{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.pcell{display:grid;gap:3px;justify-items:center}
.pcell .bt{width:100%;aspect-ratio:3/4;border-radius:5px;border:1.5px solid rgba(255,255,255,.7);display:grid;place-items:center;font-weight:800;font-size:13px;position:relative}
.pcell .bt.s0{background:#f4f6fa;color:#14202e}.pcell .bt.s1{background:#1f4fc0}.pcell .bt.s2{background:#168a49}.pcell .bt.s3{background:#a31622}.pcell .bt.s4{background:#14151a}.pcell .bt.s5{background:transparent;border-style:dashed;opacity:.35}
.pcell .bt .gem{position:absolute;left:2px;top:2px;font-size:10px}
.pcell .tc{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;border:2px solid #fff}
.pcell .tc.s0{background:#f4f6fa;color:#14202e}.pcell .tc.s1{background:#1f4fc0}.pcell .tc.s2{background:#168a49}.pcell .tc.s3{background:#a31622}.pcell .tc.s4{background:#14151a}.pcell .tc.s5{background:#c79a1d;color:#14202e}
.pcell .tc.z{opacity:.35}
.pp .ft{display:flex;gap:10px;font-size:12px;opacity:.95;flex-wrap:wrap;align-items:center}
.pp .ft span{display:inline-flex;gap:4px;align-items:center}
.pp .tot{margin-left:auto}
.pp .tot.full{color:var(--gold);font-weight:700}

/* ---------- log ---------- */
.log{grid-area:log;background:#f5f5f5;color:#1b2430;border-radius:10px;overflow:auto;max-height:200px;min-height:0;font-size:12.5px;line-height:1.5}
@media (min-width:1000px) and (min-height:620px){.log{max-height:none;height:100%;min-height:150px}}
.log .e{padding:7px 10px;border-bottom:1px solid #d6d9de}
.log .e b{color:#d4531f}
.log .e .ic svg{width:1.4em;height:1.4em}
.log .e.new{background:#fff7d6}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,12,26,.7);display:grid;place-items:center;padding:16px;overflow:auto}
.sheet{background:#10294b;border:2px solid var(--gold);border-radius:16px;padding:18px;max-width:min(94vw,460px);width:100%;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.sheet h2{margin:0;font-size:18px}
.sheet p{margin:0;font-size:14px;line-height:1.6;opacity:.95}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.big{--cw:150px;width:150px;height:200px;justify-self:center}
.paybox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:14px}
.paybox .chip{font-size:15px}
.err{color:var(--bad);font-size:13px;text-align:center}
.dis{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dcell{display:grid;gap:6px;justify-items:center}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:50%;border:1px solid var(--glass-line);background:rgba(255,255,255,.15);font-weight:800;font-size:16px;padding:0}
.stepper button:disabled{opacity:.3}
.nobchoice{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.nobchoice .noble{--cw:100px}
.rank{display:grid;gap:6px}
.rank .r{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px}
.rank .r.w{background:rgba(242,193,78,.22);border:1px solid var(--gold)}
.rank .r .sc{margin-left:auto;font-weight:800}
.rules li{margin-bottom:6px;font-size:13.5px;line-height:1.55}
.rules ul{padding-left:18px;margin:0}

/* ---------- setup ---------- */
.setup{min-height:100%;display:grid;place-items:center;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.panel{width:min(100%,560px);background:var(--glass-dark);border:1px solid var(--glass-line);border-radius:20px;padding:clamp(18px,4vw,32px);display:grid;gap:22px;backdrop-filter:blur(4px)}
.panel h1{margin:0;font-family:var(--font-disp);font-weight:800;font-size:clamp(34px,8vw,52px);color:var(--gold);text-shadow:0 2px 0 #000,0 0 14px rgba(0,0,0,.4);letter-spacing:.03em;text-align:center;line-height:1.1}
.panel .sub{text-align:center;opacity:.9;font-size:14px;margin-top:-10px}
.field{display:grid;gap:8px}
.field > label,.field > .lbl{font-weight:700;font-size:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{border:2px solid var(--glass-line);background:rgba(255,255,255,.1);border-radius:12px;padding:12px 6px;font-weight:700;display:grid;gap:2px;justify-items:center;line-height:1.3}
.seg.all{grid-auto-flow:row;grid-template-columns:repeat(5,1fr)}
.seg.all button{padding:10px 2px;font-size:13px}
.rp select{background:rgba(255,255,255,.15);color:#fff;border:1px solid var(--glass-line);border-radius:8px;padding:3px 4px;font:inherit;font-size:12px}
.rp select option{color:#000}
.seg button small{font-weight:400;opacity:.85;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:#fff}
.field input[type=text]{background:rgba(255,255,255,.12);border:1px solid var(--glass-line);border-radius:10px;color:#fff;padding:10px 12px;font:inherit;width:100%}
.roster{display:flex;gap:8px;flex-wrap:wrap}
.roster .rp{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:99px;padding:4px 12px 4px 4px;font-size:13px}
.start{font-size:17px;padding:14px;border-radius:12px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="gem0" viewBox="0 0 24 24"><polygon points="12,1.5 22.5,10 12,22.5 1.5,10" fill="currentColor" stroke="rgba(0,0,0,.5)" stroke-width="1.3" stroke-linejoin="round"/><polygon points="12,1.5 17,10 12,22.5 7,10" fill="#fff" opacity=".4"/><polygon points="1.5,10 22.5,10 12,12 " fill="#000" opacity=".08"/></symbol>

    <symbol id="gem3" viewBox="0 0 24 24"><polygon points="12,1.5 21.5,6.8 21.5,17.2 12,22.5 2.5,17.2 2.5,6.8" fill="currentColor" stroke="rgba(0,0,0,.5)" stroke-width="1.3" stroke-linejoin="round"/><polygon points="12,1.5 21.5,6.8 12,12 2.5,6.8" fill="#fff" opacity=".35"/></symbol>
    <symbol id="gem4" viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="4" fill="currentColor" stroke="rgba(255,255,255,.7)" stroke-width="1.3"/><rect x="5.5" y="5.5" width="6.5" height="6.5" rx="2" fill="#fff" opacity=".25"/></symbol>
    <symbol id="gem5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="currentColor" stroke="rgba(0,0,0,.5)" stroke-width="1.3"/><polygon points="12,5 14,10 19,10 15,13.3 16.6,18.5 12,15.4 7.4,18.5 9,13.3 5,10 10,10" fill="#fff" opacity=".7"/></symbol>
  </defs>
</svg>

<div id="app"></div>

<script>
'use strict';
/* Splendor engine + AI. No DOM. Works in browser (global Splendor) and node (module.exports). */
(function (root) {
  const COLORS = ['white', 'blue', 'green', 'red', 'black'];
  const C_KO = ['다이아몬드', '사파이어', '에메랄드', '루비', '오닉스', '황금'];
  const WIN_SCORE = 15;
  const MAX_TOKENS = 10;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rnd) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  const sum = (a) => a.reduce((x, y) => x + y, 0);

  /* ---------- data ---------- */
  // pattern: costs over the 4 non-bonus colors, points
  const PAT = {
    1: [[[1, 1, 1, 1], 0], [[2, 1, 1, 1], 0], [[2, 2, 1, 0], 0], [[3, 1, 1, 0], 0],
        [[2, 1, 0, 0], 0], [[3, 0, 0, 0], 0], [[2, 0, 2, 0], 0], [[4, 0, 0, 0], 1]],
    2: [[[3, 2, 2, 0], 1], [[2, 3, 0, 3], 1], [[5, 0, 0, 0], 2], [[5, 3, 0, 0], 2],
        [[4, 2, 1, 0], 2], [[6, 0, 0, 0], 3]],
    3: [[[3, 3, 5, 3], 3], [[7, 0, 0, 0], 4], [[6, 3, 3, 0], 4], [[7, 3, 0, 0], 5]]
  };
  function buildCards() {
    const cards = []; let id = 0;
    for (const lv of [1, 2, 3]) {
      for (let c = 0; c < 5; c++) {
        PAT[lv].forEach(([P, pts], k) => {
          const cost = [0, 0, 0, 0, 0];
          const rot = (c * 2 + k) % 4;
          for (let j = 0; j < 4; j++) cost[(c + 1 + ((j + rot) % 4)) % 5] = P[j];
          cards.push({ id: id++, level: lv, color: c, points: pts, cost });
        });
      }
    }
    return cards;
  }
  const NOBLES = [
    { name: '세라핀 대공비', req: [4, 4, 0, 0, 0] },
    { name: '카시안 총독', req: [0, 4, 4, 0, 0] },
    { name: '이사벨라 후작부인', req: [0, 0, 4, 4, 0] },
    { name: '마티아스 원로', req: [0, 0, 0, 4, 4] },
    { name: '오렐리아 여공작', req: [4, 0, 0, 0, 4] },
    { name: '라파엘 백작', req: [3, 3, 3, 0, 0] },
    { name: '엘레노어 공주', req: [0, 3, 3, 3, 0] },
    { name: '발타자르 대사', req: [0, 0, 3, 3, 3] },
    { name: '리비아 상인장', req: [3, 0, 0, 3, 3] },
    { name: '테오도르 제독', req: [3, 3, 0, 0, 3] }
  ].map((n, i) => ({ id: i, points: 3, ...n }));

  /* ---------- helpers ---------- */
  const cur = (s) => s.players[s.cur];
  function bonuses(p) { const b = [0, 0, 0, 0, 0]; for (const c of p.cards) b[c.color]++; return b; }
  function score(p) { return p.cards.reduce((a, c) => a + c.points, 0) + p.nobles.length * 3; }

  // tokens to pay for a card, or null if unaffordable
  function payment(p, card) {
    const b = bonuses(p);
    const pay = [0, 0, 0, 0, 0, 0];
    let short = 0;
    for (let i = 0; i < 5; i++) {
      const need = Math.max(0, card.cost[i] - b[i]);
      const use = Math.min(need, p.tokens[i]);
      pay[i] = use; short += need - use;
    }
    if (short > p.tokens[5]) return null;
    pay[5] = short;
    return pay;
  }

  function newGame(o) {
    const n = o.players.length;
    const seed = o.seed != null ? o.seed : (Math.random() * 2147483647) | 0;
    const rnd = mulberry32(seed);
    const all = shuffle(buildCards(), rnd);
    const decks = [1, 2, 3].map((lv) => all.filter((c) => c.level === lv));
    const board = decks.map((d) => d.splice(d.length - 4, 4));
    const per = n === 2 ? 4 : n === 3 ? 5 : 7;
    const s = {
      n, seed, rnd,
      players: o.players.map((p) => ({
        name: p.name, ai: !!p.ai, level: p.level || 0, avatar: p.avatar || 0,
        tokens: [0, 0, 0, 0, 0, 0], cards: [], reserved: [], nobles: []
      })),
      bank: [per, per, per, per, per, 5],
      initialBank: [per, per, per, per, per, 5],
      decks, board,
      nobles: shuffle(NOBLES.slice(), rnd).slice(0, n + 1),
      start: o.start != null ? o.start : Math.floor(rnd() * n),
      cur: 0, turn: 1, endTriggered: false, pending: null, phase: 'play',
      winners: [], log: [], passes: 0
    };
    s.cur = s.start;
    return s;
  }

  function addLog(s, e) { e.p = e.p != null ? e.p : s.cur; s.log.push(e); if (s.log.length > 80) s.log.shift(); }

  function hasMoves(s) {
    const p = cur(s);
    if (s.bank.slice(0, 5).some((x) => x > 0)) return true;
    if (p.reserved.length < 3 && (s.board.some((r) => r.some(Boolean)) || s.decks.some((d) => d.length))) return true;
    for (const r of s.board) for (const c of r) if (c && payment(p, c)) return true;
    for (const c of p.reserved) if (payment(p, c)) return true;
    return false;
  }

  /* ---------- actions ---------- */
  function validTake(s, cols) {
    const k = cols.length;
    if (k < 1 || k > 3) return false;
    for (const c of cols) if (!(c >= 0 && c < 5)) return false;
    const set = new Set(cols);
    if (k === 2 && set.size === 1) return s.bank[cols[0]] >= 4;
    if (set.size !== k) return false;
    for (const c of cols) if (s.bank[c] < 1) return false;
    const avail = s.bank.slice(0, 5).filter((x) => x > 0).length;
    return k === Math.min(3, avail);
  }

  function guard(s) {
    if (s.phase !== 'play') return '게임이 끝났습니다.';
    if (s.pending) return '먼저 보류 중인 선택을 끝내야 합니다.';
    return null;
  }

  function takeGems(s, cols) {
    const g = guard(s); if (g) return { ok: false, err: g };
    if (!validTake(s, cols)) return { ok: false, err: '그 조합으로는 보석을 가져올 수 없습니다.' };
    const p = cur(s);
    for (const c of cols) { s.bank[c]--; p.tokens[c]++; }
    addLog(s, { t: 'take', cols: cols.slice() });
    afterAction(s);
    return { ok: true };
  }

  function takeFromBoard(s, level, idx) {
    const c = s.board[level - 1][idx];
    s.board[level - 1][idx] = s.decks[level - 1].pop() || null;
    return c;
  }

  function reserve(s, level, idx) {
    const g = guard(s); if (g) return { ok: false, err: g };
    const p = cur(s);
    if (p.reserved.length >= 3) return { ok: false, err: '예약은 최대 3장입니다.' };
    let card;
    if (idx === -1) {
      if (!s.decks[level - 1].length) return { ok: false, err: '덱이 비었습니다.' };
      card = s.decks[level - 1].pop();
    } else {
      if (!s.board[level - 1][idx]) return { ok: false, err: '카드가 없습니다.' };
      card = takeFromBoard(s, level, idx);
    }
    p.reserved.push(card);
    let gold = false;
    if (s.bank[5] > 0) { s.bank[5]--; p.tokens[5]++; gold = true; }
    addLog(s, { t: 'reserve', level, fromDeck: idx === -1, color: idx === -1 ? null : card.color, gold });
    afterAction(s);
    return { ok: true };
  }

  function buy(s, src) {
    const g = guard(s); if (g) return { ok: false, err: g };
    const p = cur(s);
    let card;
    if (src.from === 'res') card = p.reserved[src.idx];
    else card = s.board[src.level - 1][src.idx];
    if (!card) return { ok: false, err: '카드가 없습니다.' };
    const pay = payment(p, card);
    if (!pay) return { ok: false, err: '보석이 부족합니다.' };
    for (let i = 0; i < 6; i++) { p.tokens[i] -= pay[i]; s.bank[i] += pay[i]; }
    if (src.from === 'res') p.reserved.splice(src.idx, 1);
    else takeFromBoard(s, src.level, src.idx);
    p.cards.push(card);
    addLog(s, { t: 'buy', color: card.color, points: card.points, level: card.level });
    afterAction(s);
    return { ok: true };
  }

  function discard(s, arr) {
    if (!s.pending || s.pending.type !== 'discard') return { ok: false, err: '반납할 필요가 없습니다.' };
    const p = cur(s);
    if (sum(arr) !== s.pending.count) return { ok: false, err: `보석 ${s.pending.count}개를 반납해야 합니다.` };
    for (let i = 0; i < 6; i++) if (arr[i] < 0 || arr[i] > p.tokens[i]) return { ok: false, err: '가진 보석보다 많이 반납할 수 없습니다.' };
    const out = [];
    for (let i = 0; i < 6; i++) { p.tokens[i] -= arr[i]; s.bank[i] += arr[i]; for (let k = 0; k < arr[i]; k++) out.push(i); }
    addLog(s, { t: 'discard', cols: out });
    s.pending = null;
    proceedNoble(s);
    return { ok: true };
  }

  function chooseNoble(s, nobleId) {
    if (!s.pending || s.pending.type !== 'noble' || !s.pending.options.includes(nobleId)) return { ok: false, err: '선택할 수 없는 귀족입니다.' };
    claimNoble(s, nobleId);
    s.pending = null;
    endTurn(s);
    return { ok: true };
  }

  function afterAction(s) {
    const p = cur(s);
    const total = sum(p.tokens);
    if (total > MAX_TOKENS) { s.pending = { type: 'discard', count: total - MAX_TOKENS }; return; }
    proceedNoble(s);
  }
  function eligibleNobles(s) {
    const b = bonuses(cur(s));
    return s.nobles.filter((n) => n.req.every((r, i) => b[i] >= r)).map((n) => n.id);
  }
  function claimNoble(s, id) {
    const i = s.nobles.findIndex((n) => n.id === id);
    const n = s.nobles.splice(i, 1)[0];
    cur(s).nobles.push(n);
    addLog(s, { t: 'noble', name: n.name });
  }
  function proceedNoble(s) {
    const el = eligibleNobles(s);
    if (el.length === 1) { claimNoble(s, el[0]); endTurn(s); }
    else if (el.length > 1) s.pending = { type: 'noble', options: el };
    else endTurn(s);
  }

  function finish(s) {
    s.phase = 'over';
    const rank = s.players.map((p, i) => ({ i, sc: score(p), cn: p.cards.length }));
    rank.sort((a, b) => b.sc - a.sc || a.cn - b.cn);
    const top = rank[0];
    s.winners = rank.filter((r) => r.sc === top.sc && r.cn === top.cn).map((r) => r.i);
    s.ranking = rank;
  }

  function endTurn(s) {
    const p = cur(s);
    if (score(p) >= WIN_SCORE) s.endTriggered = true;
    let guardN = 0;
    for (;;) {
      s.cur = (s.cur + 1) % s.n;
      if (s.cur === s.start) s.turn++;
      if (s.endTriggered && s.cur === s.start) { finish(s); return; }
      if (hasMoves(s)) { s.passes = 0; return; }
      addLog(s, { t: 'pass' });
      if (++s.passes >= s.n || ++guardN > s.n + 1) { finish(s); return; }
    }
  }

  /* ---------- AI ---------- */
  function visible(s, p) {
    const out = [];
    for (let l = 0; l < 3; l++) for (let i = 0; i < 4; i++) {
      const c = s.board[l][i];
      if (c) out.push({ card: c, src: { from: 'board', level: l + 1, idx: i }, res: false });
    }
    p.reserved.forEach((c, i) => out.push({ card: c, src: { from: 'res', idx: i }, res: true }));
    return out;
  }
  function deficit(p, card, b) {
    const d = [0, 0, 0, 0, 0]; let t = 0;
    for (let i = 0; i < 5; i++) { d[i] = Math.max(0, card.cost[i] - b[i] - p.tokens[i]); t += d[i]; }
    return { d, eff: Math.max(0, t - p.tokens[5]) };
  }
  function colorUse(s, c, b) {
    let u = 0;
    for (const r of s.board) for (const k of r) if (k && k.cost[c] > b[c]) u += 1 + (k.points > 1 ? 0.5 : 0);
    return u;
  }
  function nobleNeed(s, c, b) {
    let u = 0;
    for (const n of s.nobles) if (n.req[c] > b[c]) u += 1;
    return u;
  }
  function buyValue(s, p, card, pay, b) {
    let v = 14 + card.points * 11;
    v += Math.min(colorUse(s, card.color, b), 6) * 1.2;
    v += nobleNeed(s, card.color, b) * 3;
    v -= pay[5] * 5;
    v -= sum(pay) * 0.6;
    if (score(p) + card.points >= WIN_SCORE) v += 500;
    if (card.points === 0 && b[card.color] >= 4) v -= 8;
    return v;
  }
  function targets(s, p, b) {
    const list = [];
    for (const v of visible(s, p)) {
      const { d, eff } = deficit(p, v.card, b);
      if (eff === 0) continue;
      const cv = Math.min(colorUse(s, v.card.color, b), 6);
      let g = (v.card.points * 4 + 1 + cv * 0.6 + nobleNeed(s, v.card.color, b) * 1.5) / Math.pow(eff + 1.2, 1.4);
      if (v.res) g *= 1.15;
      list.push({ ...v, d, eff, g });
    }
    list.sort((a, b2) => b2.g - a.g);
    return list;
  }
  function oppCanBuy(s, me, card) {
    for (let i = 0; i < s.n; i++) {
      if (i === me) continue;
      if (payment(s.players[i], card)) return true;
    }
    return false;
  }

  function legalList(s) {
    const p = cur(s); const out = [];
    for (const v of visible(s, p)) if (payment(p, v.card)) out.push({ t: 'buy', src: v.src });
    const avail = [0, 1, 2, 3, 4].filter((i) => s.bank[i] > 0);
    const k = Math.min(3, avail.length);
    if (k > 0) {
      const combos = [];
      const rec = (start, acc) => { if (acc.length === k) { combos.push(acc.slice()); return; } for (let i = start; i < avail.length; i++) { acc.push(avail[i]); rec(i + 1, acc); acc.pop(); } };
      rec(0, []);
      for (const c of combos) out.push({ t: 'take', cols: c });
    }
    for (let i = 0; i < 5; i++) if (s.bank[i] >= 4) out.push({ t: 'take', cols: [i, i] });
    if (p.reserved.length < 3) {
      for (let l = 1; l <= 3; l++) {
        for (let i = 0; i < 4; i++) if (s.board[l - 1][i]) out.push({ t: 'reserve', level: l, idx: i });
        if (s.decks[l - 1].length) out.push({ t: 'reserve', level: l, idx: -1 });
      }
    }
    return out;
  }

  const S_score = score;
  // difficulty level: 0 very easy, 1 easy, 2 normal, 3 hard, 4 very hard
  function aiAction(s) {
    const p = cur(s); const me = s.cur; const lv = p.level;
    const b = bonuses(p);
    const rnd = s.rnd;

    if (rnd() < [0.55, 0.3, 0.1, 0, 0][lv]) {
      const legal = legalList(s);
      const nonRes = legal.filter((a) => a.t !== 'reserve');
      const pool = nonRes.length ? nonRes : legal;
      return pool[Math.floor(rnd() * pool.length)];
    }

    // 1. buy
    let best = null, bv = -1e9;
    for (const v of visible(s, p)) {
      const pay = payment(p, v.card);
      if (!pay) continue;
      let val = buyValue(s, p, v.card, pay, b) + rnd() * ([14, 8, 3, 0.5, 0.5][lv]);
      if (lv === 4 && s.players.some((q, qi) => qi !== me && S_score(q) >= 11)) val += v.card.points * 8;
      if (val > bv) { bv = val; best = { t: 'buy', src: v.src }; }
    }
    if (best) return best;

    const T = targets(s, p, b);

    // 2. reserve (deny / secure)
    if (lv >= 2 && p.reserved.length < 3 && T.length) {
      const t0 = T[0];
      if (!t0.res) {
        const threat = lv >= 3 && t0.card.points >= (lv === 4 ? 1 : 2) && oppCanBuy(s, me, t0.card);
        const secure = t0.card.points >= (lv === 4 ? 2 : 3) && t0.eff <= 3 && p.reserved.length < 2 && s.bank[5] > 0;
        if (threat || secure) return { t: 'reserve', level: t0.src.level, idx: t0.src.idx };
      }
    }

    // 3. take gems
    const w = [0, 0, 0, 0, 0];
    T.slice(0, 3).forEach((t, k) => {
      const f = k === 0 ? 1 : k === 1 ? 0.5 : 0.25;
      for (let i = 0; i < 5; i++) if (t.d[i] > 0) w[i] += f * (t.g + 0.1) * Math.min(t.d[i], 3);
    });
    for (let i = 0; i < 5; i++) w[i] += 0.02 * colorUse(s, i, b) + rnd() * 0.002;
    const avail = [0, 1, 2, 3, 4].filter((i) => s.bank[i] > 0);
    let cand = null, cv = -1e9;
    if (avail.length) {
      const k = Math.min(3, avail.length);
      const top = avail.slice().sort((a, c) => w[c] - w[a]).slice(0, k);
      let val = top.reduce((x, i) => x + w[i], 0);
      const over = Math.max(0, sum(p.tokens) + k - MAX_TOKENS);
      val -= over * 0.15 * (val / k);
      cand = { t: 'take', cols: top }; cv = val;
    }
    for (let i = 0; i < 5; i++) {
      if (s.bank[i] >= 4 && T.length && T[0].d[i] >= 2) {
        let val = 2 * w[i] * 1.15;
        const over = Math.max(0, sum(p.tokens) + 2 - MAX_TOKENS);
        val -= over * 0.15 * w[i];
        if (val > cv) { cv = val; cand = { t: 'take', cols: [i, i] }; }
      }
    }
    if (cand && (cv > 0.0021 * 3 || !(p.reserved.length < 3))) return cand;

    // 4. fallbacks
    if (p.reserved.length < 3) {
      if (T.length && !T[0].res) return { t: 'reserve', level: T[0].src.level, idx: T[0].src.idx };
      const legal = legalList(s).filter((a) => a.t === 'reserve');
      if (legal.length) return legal[Math.floor(rnd() * legal.length)];
    }
    if (cand) return cand;
    const legal = legalList(s);
    return legal[Math.floor(rnd() * legal.length)];
  }

  function aiDiscard(s) {
    const p = cur(s); const b = bonuses(p);
    const T = targets(s, p, b).slice(0, 2);
    const keep = [0, 0, 0, 0, 0, 99];
    for (const t of T) for (let i = 0; i < 5; i++) keep[i] = Math.max(keep[i], Math.max(0, t.card.cost[i] - b[i]));
    const tk = p.tokens.slice();
    const out = [0, 0, 0, 0, 0, 0];
    for (let n = 0; n < s.pending.count; n++) {
      let bi = -1, bs = -1e9;
      for (let i = 0; i < 6; i++) {
        if (tk[i] <= 0) continue;
        const sc = (i === 5 ? -50 : 0) + (tk[i] - keep[i]) * 3 + tk[i];
        if (sc > bs) { bs = sc; bi = i; }
      }
      tk[bi]--; out[bi]++;
    }
    return out;
  }
  function aiNoble(s) { return s.pending.options[0]; }

  // Perform one AI step on the current state (handles pending too). Returns result of the engine call.
  function aiStep(s) {
    if (s.phase !== 'play') return { ok: false };
    if (s.pending) {
      if (s.pending.type === 'discard') return discard(s, aiDiscard(s));
      return chooseNoble(s, aiNoble(s));
    }
    const a = aiAction(s);
    if (a.t === 'buy') return buy(s, a.src);
    if (a.t === 'take') return takeGems(s, a.cols);

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- procedural art ---------- */
const PAL = [
  { sky: ['#dfe9f5', '#9db4d3'], far: '#7d92b3', near: '#56698a', ground: '#3b4a66', win: '#fff3b0' },
  { sky: ['#8ec0f0', '#3a5fb0'], far: '#3a4f9a', near: '#27367a', ground: '#192353', win: '#ffe28a' },
  { sky: ['#d9ee9a', '#5fae5e'], far: '#3f8a4a', near: '#2a6a3a', ground: '#173f25', win: '#fff3a0' },
  { sky: ['#f6b57a', '#cf4b34'], far: '#a23a35', near: '#7a2630', ground: '#431320', win: '#ffd88a' },
  { sky: ['#b7ad9d', '#5d5953'], far: '#4a4742', near: '#302e30', ground: '#18181b', win: '#ffd27a' }
];
function rng(seed) { let a = seed * 2654435761 >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const artCache = {};
function art(card) {
  if (artCache[card.id]) return artCache[card.id];
  if (IMG && IMG.arts[card.color]) { const pool = IMG.arts[card.color]; return (artCache[card.id] = `url('${pool[(card.id * 7 + card.level) % pool.length]}')`); }
  const P = PAL[card.color], r = rng(card.id + 7), L = card.level;
  let s = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 133' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${P.sky[0]}'/><stop offset='1' stop-color='${P.sky[1]}'/></linearGradient></defs><rect width='100' height='133' fill='url(#g)'/>`;
  s += `<circle cx='${20 + r() * 60}' cy='${22 + r() * 18}' r='${6 + r() * 5}' fill='#fff' opacity='.55'/>`;
  let pts = '0,133 0,' + (70 + r() * 15);
  for (let x = 12; x <= 100; x += 14) pts += ` ${x},${58 + r() * 30}`;
  s += `<polygon points='${pts} 100,133' fill='${P.far}'/>`;
  const nb = 3 + Math.floor(r() * 3);
  let x = -4;
  for (let i = 0; i < nb; i++) {
    const w = 18 + r() * 16, h = 28 + r() * (22 + L * 8), y = 118 - h;
    s += `<rect x='${x}' y='${y}' width='${w}' height='${h + 20}' fill='${P.near}'/>`;
    if (L === 1) s += `<polygon points='${x - 2},${y} ${x + w / 2},${y - 10 - r() * 6} ${x + w + 2},${y}' fill='${P.ground}'/>`;
    else if (L === 2) s += `<path d='M${x} ${y} a${w / 2} ${w / 2} 0 0 1 ${w} 0z' fill='${P.ground}'/>`;
    else s += `<polygon points='${x + w * .3},${y} ${x + w / 2},${y - 18 - r() * 10} ${x + w * .7},${y}' fill='${P.ground}'/>`;
    for (let k = 0; k < 3; k++) if (r() > .35) s += `<rect x='${x + 3 + r() * (w - 8)}' y='${y + 6 + k * 10}' width='3' height='4' fill='${P.win}' opacity='.85'/>`;
    x += w - 2 + r() * 3;
  }
  s += `<polygon points='0,133 0,${112 + r() * 6} 100,${108 + r() * 8} 100,133' fill='${P.ground}'/></svg>`;
  return (artCache[card.id] = `url('data:image/svg+xml,${encodeURIComponent(s).replace(/'/g, '%27')}')`);
}
function portrait(id) {
  if (IMG) return `<span class="port" style="background-image:url('${IMG.nobles[id % 5]}');${id >= 5 ? 'transform:scaleX(-1)' : ''}"></span>`;
  const r = rng(id * 31 + 5);
  const bgs = [['#c9a15a','#6b4a1f'],['#7aa0c9','#2b4a73'],['#b86a6a','#5a2230'],['#8fbf8f','#2f5a3a'],['#a08ac9','#40306e']];
  const [b1, b2] = bgs[id % 5];
  const skin = ['#e8c4a0', '#c99468', '#f0d2b4', '#a8714a', '#d9a97c'][Math.floor(r() * 5)];
  const robe = ['#7b1e2b', '#1f3d6b', '#2f5a3a', '#4a2a6b', '#6b4a1f'][(id + 2) % 5];
  const hat = id % 4;
  let s = `<svg class='port' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='b' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${b1}'/><stop offset='1' stop-color='${b2}'/></linearGradient></defs><rect width='100' height='100' fill='url(#b)'/>`;
  s += `<path d='M8 100 Q12 66 50 62 Q88 66 92 100z' fill='${robe}'/><path d='M38 64 L50 82 L62 64z' fill='#f1e6c8'/>`;
  s += `<rect x='44' y='50' width='12' height='14' fill='${skin}'/><ellipse cx='50' cy='40' rx='14' ry='17' fill='${skin}'/>`;
  if (hat === 0) s += `<path d='M33 33 L36 16 L43 26 L50 12 L57 26 L64 16 L67 33z' fill='#f2c14e' stroke='#8a5a07' stroke-width='1.5'/>`;
  else if (hat === 1) s += `<path d='M32 36 Q34 10 50 10 Q70 10 68 36 Q50 28 32 36z' fill='#efe9dd'/><ellipse cx='50' cy='14' rx='16' ry='6' fill='#f7f3ea'/>`;
  else if (hat === 2) s += `<path d='M30 40 Q30 12 50 12 Q70 12 70 40 Q66 26 50 26 Q34 26 30 40z' fill='#2b1d14'/>`;
  else s += `<path d='M28 34 Q50 4 72 34 Q50 26 28 34z' fill='#26334f'/><rect x='26' y='33' width='48' height='5' rx='2' fill='#f2c14e'/>`;
  s += `<circle cx='44' cy='41' r='1.6' fill='#222'/><circle cx='56' cy='41' r='1.6' fill='#222'/><path d='M44 49 Q50 53 56 49' stroke='#7a3a2a' stroke-width='1.6' fill='none'/></svg>`;
  return s;
}

/* ---------- renderers ---------- */
function cardHTML(card, opts = {}) {
  const can = opts.can ? ' can' : '';
  const res = opts.res ? ' res' : '';
  const costs = card.cost.map((v, i) => v ? chip(i, v) : '').join('');
  const pts = card.points ? `<span class="pts">${card.points}</span>` : '';
  const attrs = opts.attrs || '';
  const label = `${S.C_KO[card.color]} 카드, ${card.points}점, 비용 ` + card.cost.map((v, i) => v ? S.C_KO[i] + ' ' + v : '').filter(Boolean).join(', ');
  return `<button class="card${can}${res}" style="background-image:${art(card)}" ${attrs} aria-label="${label}"><span class="shade"></span>${pts}<span class="bon">${gem(card.color)}</span><span class="costs">${costs}</span></button>`;
}
function nobleHTML(n, opts = {}) {
  const req = n.req.map((v, i) => v ? chip(i, v) : '').join('');
  return `<${opts.tag || 'div'} class="noble${opts.can ? ' can' : ''}${opts.cls ? ' ' + opts.cls : ''}" ${opts.attrs || ''} title="${esc(n.name)}">${portrait(n.id)}<span class="pts">3</span><span class="req">${req}</span></${opts.tag || 'div'}>`;
}

function setupHTML() {
  const ais = Array.from({ length: UI.n - 1 }, (_, i) => AI_NAMES[i]);
  return `<div class="setup"><div class="panel">
    <h1>Splendor</h1>
    <div class="sub">보석 상인이 되어 AI와 15점을 먼저 모으세요</div>
    <div class="field"><span class="lbl">플레이어 수</span>
      <div class="seg" role="group" aria-label="플레이어 수">${[2, 3, 4].map((n) => `<button data-act="n" data-v="${n}" aria-pressed="${UI.n === n}">${n}인<small>나 + AI ${n - 1}명</small></button>`).join('')}</div>
    </div>
    <div class="field"><span class="lbl">AI 난이도 <small style="font-weight:400;opacity:.8">(봇마다 따로 정할 수 있어요)</small></span>
      <div class="seg all" role="group" aria-label="모든 AI 난이도 일괄 설정">${LEVELS.map((l, i) => `<button data-act="lvall" data-v="${i}" aria-pressed="${ais.every((_, k) => UI.lvs[k] === i)}">${l.n}</button>`).join('')}</div>
    </div>
    <div class="field"><label for="nm">내 이름</label><input id="nm" type="text" maxlength="10" value="${esc(UI.name)}" autocomplete="off"></div>
    <div class="field"><span class="lbl">참가자</span><div class="roster">
      <span class="rp"><span class="av" style="background:${AV[0]};width:26px;height:26px;font-size:12px">${esc((UI.name || '나')[0])}</span>${esc(UI.name || '나')}</span>
      ${ais.map((a, i) => `<span class="rp"><span class="av" style="background:${AV[i + 1]};width:26px;height:26px;font-size:12px">${a[0]}</span>${a} · AI <select data-act="lvone" data-k="${i}" aria-label="${a} 난이도">${LEVELS.map((l, j) => `<option value="${j}"${UI.lvs[i] === j ? ' selected' : ''}>${l.n}</option>`).join('')}</select></span>`).join('')}

  </div>${UI.modal ? modalHTML() : ''}</div>`;

function playerPanel(p, i) {
  const b = S.bonuses(p);
  const total = S.sum(p.tokens);
  const cols = [0, 1, 2, 3, 4, 5].map((c) => `<div class="pcell"><div class="bt s${c}">${c < 5 ? `${gem(c)}${b[c]}` : ''}</div><div class="tc s${c}${p.tokens[c] ? '' : ' z'}">${p.tokens[c]}</div></div>`).join('');
  const turn = G.phase === 'play' && G.cur === i;
  return `<div class="pp${turn ? ' turn' : ''}"><div class="hd"><span class="av" style="background:${AV[i]}">${esc(p.name[0])}</span><span class="nm">${esc(p.name)}</span>${p.ai ? `<span class="ai">AI·${LEVELS[p.level].n}</span>` : ''}<span class="sc"><i>★</i>${S.score(p)}</span></div>
  <div class="cols">${cols}</div>
  <div class="ft"><span>카드 ${p.cards.length}</span><span>예약 ${p.reserved.length}/3</span><span>귀족 ${p.nobles.length}</span><span class="tot${total >= 10 ? ' full' : ''}">보석 ${total}/10</span></div></div>`;
}

function logHTML() {
  const items = G.log.slice(-40).reverse().map((e, k) => {
    const nm = `<b>${esc(G.players[e.p].name)}</b>`;
    let t = '';
    if (e.t === 'take') t = `${nm}님이 ${icons(e.cols)}를 받습니다`;
    else if (e.t === 'buy') t = `${nm}님이 ${gem(e.color)} ${e.level}단계 카드(${e.points}점)를 구입합니다`;
    else if (e.t === 'reserve') t = `${nm}님이 ${e.fromDeck ? e.level + '단계 덱의 카드를' : gem(e.color) + ' ' + e.level + '단계 카드를'} 예약합니다${e.gold ? ' ' + icons([5]) : ''}`;
    else if (e.t === 'discard') t = `${nm}님이 ${icons(e.cols)}를 반납합니다`;
    else if (e.t === 'noble') t = `${nm}님에게 귀족 ${esc(e.name)}이(가) 찾아왔습니다 (+3)`;
    else if (e.t === 'pass') t = `${nm}님은 할 수 있는 행동이 없어 넘어갑니다`;
    return `<div class="e${k === 0 ? ' new' : ''}">${t}</div>`;
  });
  return `<div class="log" aria-live="polite" aria-label="진행 기록">${items.join('') || '<div class="e">게임이 시작되었습니다</div>'}</div>`;
}

function selInfo() {
  const sel = UI.sel;
  const ok = sel.length && S.validTake(G, sel);
  return { ok };
}

function gameHTML() {
  const mine = isMyTurn();
  const p0 = me();
  const b0 = S.bonuses(p0);
  const cp = G.players[G.cur];
  let msg;
  if (G.phase === 'over') msg = '게임이 종료되었습니다';
  else if (G.cur === 0) msg = `<span class="name">${esc(p0.name)}</span>님의 차례입니다 · 행동을 선택하세요`;
  else msg = `<span class="name">${esc(cp.name)}</span>님이 차례를 진행합니다`;
  const last = G.endTriggered && G.phase === 'play' ? '<span class="tag">마지막 라운드</span>' : '';

  // board rows (level 3 on top)
  const rowsHTML = [3, 2, 1].map((lv) => {
    const deckN = G.decks[lv - 1].length;
    const canRes = mine && p0.reserved.length < 3 && deckN > 0;
    const deckBg = IMG ? ` style="background-image:url('${IMG.decks[lv - 1]}');background-size:100% 100%"` : '';
    const deck = `<div class="cell"><button${deckBg} class="deck l${lv}${canRes ? ' can' : ''}${deckN ? '' : ' none'}" ${canRes ? `data-act="deck" data-lv="${lv}"` : 'disabled'} aria-label="${lv}단계 덱, 남은 카드 ${deckN}장"><span class="cnt">${deckN}</span>${IMG ? '' : `<span class="title">Splendor</span><span class="dots">${'<i></i>'.repeat(lv)}</span>`}</button></div>`;
    const cells = G.board[lv - 1].map((c, i) => c ? `<div class="cell">${cardHTML(c, { can: mine && !!S.payment(p0, c), attrs: `data-act="card" data-lv="${lv}" data-i="${i}"` })}</div>` : `<div class="cell"><div class="card empty"></div></div>`).join('');
    return `<div class="row">${deck}${cells}</div>`;
  }).join('');

  const tokensHTML = [0, 1, 2, 3, 4, 5].map((c) => {
    const n = G.bank[c];
    const selN = UI.sel.filter((x) => x === c).length;
    const can = mine && c < 5 && n > 0;
    const coin = IMG ? ` style="background-image:url('${IMG.coins[c]}');background-size:100% 100%"` : '';
    return `<button class="pile pc${c} c${c}${selN ? ' on' : ''}${can ? '' : ' off'}"${coin} ${can ? `data-act="pile" data-c="${c}"` : 'disabled'} aria-label="${S.C_KO[c]} ${n}개${c === 5 ? ' (예약하면 받습니다)' : ''}"><span class="n">${n}</span>${IMG ? '' : '<span class="inner">'}${IMG ? '' : gem(c, 'glyph').replace('class="gem', 'style="width:80%;height:80%;color:' + (c === 0 || c === 5 ? '#14202e' : '#fff') + ';opacity:.9" class="gem')}${IMG ? '' : '</span>'}${selN ? `<span class="sel">+${selN}</span>` : ''}</button>`;
  }).join('');

  const noblesHTML = G.nobles.map((n) => nobleHTML(n, { can: false, attrs: '' })).join('');

  const slots = [0, 1, 2, 3, 4, 5].map((c) => `<div class="slot s${c}"><div class="tk">${p0.tokens[c]}</div><div class="bn">${c < 5 ? `${gem(c)}+${b0[c]}` : '황금'}</div></div>`).join('');
  const total = S.sum(p0.tokens);
  const vt = UI.sel.length ? S.validTake(G, UI.sel) : false;
  let tray;
  if (mine) {
    tray = UI.sel.length
      ? `<span class="hint">선택: ${icons(UI.sel)}</span><button class="btn" data-act="take" ${vt ? '' : 'disabled'}>받기</button><button class="btn ghost" data-act="clear">취소</button>${vt ? '' : `<span class="hint">${selHint()}</span>`}`
      : `<span class="hint">보석을 눌러 서로 다른 3개(또는 같은 색 2개)를 고르거나, 카드를 눌러 구매·예약하세요</span>`;
  } else tray = `<span class="hint">${G.phase === 'over' ? '' : '상대의 차례를 기다리는 중…'}</span>`;
  if (UI.err) tray += `<span class="err">${esc(UI.err)}</span>`;

  const resHTML = p0.reserved.length
    ? p0.reserved.map((c, i) => `<div class="cell">${cardHTML(c, { can: mine && !!S.payment(p0, c), res: true, attrs: `data-act="rcard" data-i="${i}"` })}</div>`).join('')
    : '<span class="ph">예약한 카드가 없습니다</span>';
  const mynob = p0.nobles.length ? p0.nobles.map((n) => nobleHTML(n, { cls: 'mini' })).join('') : '<span class="ph" style="font-size:12px;opacity:.7">아직 없음</span>';

  return `<div class="game">
    <div class="top${mine ? ' mine' : ''}"><span>${msg}</span>${last}<span class="menu"><button data-act="rules">규칙</button><button data-act="restart">새 게임</button></span></div>
    <div class="players">${G.players.map((p, i) => playerPanel(p, i)).join('')}</div>
    <div class="boardarea">
      <div class="rows" role="group" aria-label="카드 시장">${rowsHTML}</div>
      <div class="tokens" role="group" aria-label="보석 더미">${tokensHTML}</div>
      <div class="nobles" role="group" aria-label="귀족">${noblesHTML}</div>
    </div>
    <div class="me">
      <div class="box"><span class="lab">내 보석 ${total}/10</span><div class="mygems">${slots}</div><div class="trayinfo">${tray}</div></div>
      <div class="box"><span class="lab">내 예약 ${p0.reserved.length}/3</span><div class="reserved">${resHTML}</div></div>
      <div class="box"><span class="lab r">내 귀족</span><div class="mynobles">${mynob}</div></div>
    </div>
    ${logHTML()}
    ${modalHTML()}
  </div>`;
}

function selHint() {
  const s = UI.sel;
  if (s.length === 1) return '같은 색을 한 번 더 누르면 2개를 받습니다(더미 4개 이상일 때)';
  if (s.length === 2 && s[0] !== s[1]) return '서로 다른 색 하나를 더 고르세요';
  return '';
}

/* ---------- modals ---------- */
function modalHTML() {
  if (G && G.phase === 'over') return overModal();
  if (G && G.pending && G.cur === 0) {
    if (G.pending.type === 'discard') return discardModal();
    if (G.pending.type === 'noble') return nobleModal();
  }
  const m = UI.modal;
  if (!m) return '';
  if (m.t === 'rules') return rulesModal();
  if (m.t === 'card') return cardModal(m);
  return '';
}
function rulesModal() {
  return `<div class="modal" data-act="closem"><div class="sheet rules" role="dialog" aria-modal="true" aria-label="규칙"><h2>간단 규칙</h2><ul>
  <li><b>목표</b> 먼저 명성 15점을 모으면 그 라운드를 마저 끝내고, 가장 점수가 높은 사람이 이깁니다(동점이면 카드가 적은 쪽).</li>
  <li><b>한 턴에 하나</b> ① 서로 다른 색 보석 3개 ② 같은 색 2개(더미 4개 이상) ③ 카드 예약(+황금 1개, 최대 3장) ④ 카드 구매.</li>
  <li><b>보너스</b> 산 카드는 그 색 보석 1개 역할을 영구히 합니다. 황금은 어떤 색으로도 쓸 수 있어요.</li>
  <li><b>보석 한도</b> 10개를 넘으면 초과분을 반납합니다.</li>
  <li><b>귀족</b> 요구하는 보너스를 갖추면 3점 귀족이 찾아옵니다(턴 종료 시).</li>
  </ul><div class="acts"><button class="btn" data-act="closem-btn">닫기</button></div></div></div>`;
}
function cardModal(m) {
  const p0 = me();
  let card, can = false, reason = '', canRes = false, fromRes = m.res, deck = m.deck;
  if (deck) { card = null; }
  else if (fromRes) card = p0.reserved[m.i]; else card = G.board[m.lv - 1][m.i];
  if (!deck && !card) return '';
  const mine = isMyTurn();
  if (deck) {
    return `<div class="modal" data-act="closem"><div class="sheet" role="dialog" aria-modal="true"><h2>${m.lv}단계 덱에서 예약</h2><p>덱 맨 위 카드를 확인하지 않고 예약합니다. 황금 1개를 받습니다.</p><div class="acts"><button class="btn ghost" data-act="closem-btn">닫기</button><button class="btn" data-act="res-deck" data-lv="${m.lv}" ${mine && p0.reserved.length < 3 ? '' : 'disabled'}>예약</button></div></div></div>`;
  }
  const pay = S.payment(p0, card);
  if (!mine) reason = '내 차례가 아닙니다';
  else if (!pay) reason = '보석이 부족합니다';
  can = mine && !!pay;
  canRes = mine && !fromRes && p0.reserved.length < 3;
  const payHTML = pay ? `<div class="paybox">지불 ${pay.map((v, i) => v ? chip(i, v) : '').join('') || '<span>무료</span>'}</div>` : '';
  const cardH = cardHTML(card, {});
  return `<div class="modal" data-act="closem"><div class="sheet" role="dialog" aria-modal="true" aria-label="카드 상세"><div class="cell big">${cardH.replace('class="card', 'tabindex="-1" class="card')}</div>${payHTML}${reason && !can ? `<div class="err">${reason}</div>` : ''}<div class="acts"><button class="btn ghost" data-act="closem-btn">닫기</button>${fromRes ? '' : `<button class="btn ghost" data-act="res-board" data-lv="${m.lv}" data-i="${m.i}" ${canRes ? '' : 'disabled'}>예약</button>`}<button class="btn" data-act="${fromRes ? 'buy-res' : 'buy-board'}" data-lv="${m.lv}" data-i="${m.i}" ${can ? '' : 'disabled'}>구매</button></div></div></div>`;
}
function discardModal() {
  const p0 = me(); const need = G.pending.count; const d = UI.disc; const got = S.sum(d);
  const cells = [0, 1, 2, 3, 4, 5].filter((c) => p0.tokens[c] > 0).map((c) => `<div class="dcell">${chip(c, p0.tokens[c])}<div class="stepper"><button data-act="dminus" data-c="${c}" ${d[c] > 0 ? '' : 'disabled'} aria-label="${S.C_KO[c]} 줄이기">−</button><b>${d[c]}</b><button data-act="dplus" data-c="${c}" ${d[c] < p0.tokens[c] && got < need ? '' : 'disabled'} aria-label="${S.C_KO[c]} 늘리기">+</button></div></div>`).join('');
  return `<div class="modal"><div class="sheet" role="dialog" aria-modal="true"><h2>보석이 너무 많아요</h2><p>보석은 10개까지만 가질 수 있습니다. ${need}개를 반납하세요. (선택 ${got}/${need})</p><div class="dis">${cells}</div><div class="acts"><button class="btn" data-act="discard" ${got === need ? '' : 'disabled'}>반납</button></div></div></div>`;
}
function nobleModal() {
  const opts = G.pending.options.map((id) => G.nobles.find((n) => n.id === id));
  return `<div class="modal"><div class="sheet" role="dialog" aria-modal="true"><h2>귀족을 선택하세요</h2><p>여러 귀족이 동시에 찾아왔습니다. 한 명만 모실 수 있어요.</p><div class="nobchoice">${opts.map((n) => `<div style="display:grid;gap:6px;justify-items:center">${nobleHTML(n, { tag: 'button', attrs: `data-act="noble" data-id="${n.id}"`, cls: '' })}<span style="font-size:12px">${esc(n.name)}</span></div>`).join('')}</div></div></div>`;
}
function overModal() {
  const rank = G.ranking;
  const win = G.winners.map((i) => G.players[i].name).join(', ');
  const iWon = G.winners.includes(0);
  return `<div class="modal"><div class="sheet" role="dialog" aria-modal="true"><h2>${iWon ? '🏆 승리했습니다!' : '게임 종료'}</h2><p>${G.winners.length > 1 ? '공동 우승: ' : '우승: '}<b>${esc(win)}</b></p><div class="rank">${rank.map((r, k) => { const p = G.players[r.i]; return `<div class="r${G.winners.includes(r.i) ? ' w' : ''}"><span>${k + 1}</span><span class="av" style="background:${AV[r.i]};width:28px;height:28px;font-size:13px">${esc(p.name[0])}</span><span>${esc(p.name)}</span><span class="sc">★ ${r.sc} · 카드 ${r.cn}</span></div>`; }).join('')}</div><div class="acts"><button class="btn ghost" data-act="restart">설정으로</button><button class="btn" data-act="again">같은 설정으로 다시</button></div></div></div>`;
}

/* ---------- control ---------- */
function render() {
  $app.innerHTML = G ? gameHTML() : setupHTML();
}
function startGame() {
  const names = [UI.name.trim() || '나'];
  const players = [{ name: names[0], ai: false, avatar: 0 }];
  for (let i = 0; i < UI.n - 1; i++) players.push({ name: AI_NAMES[i], ai: true, level: UI.lvs[i], avatar: i + 1 });
  G = S.newGame({ players });
  UI.sel = []; UI.modal = null; UI.err = ''; UI.disc = [0, 0, 0, 0, 0, 0];
  render(); schedule();
}
function schedule() {
  clearTimeout(UI.timer);
  if (!G || G.phase !== 'play') return;
  const needsAI = G.players[G.cur].ai || false;
  if (!needsAI) return;
  UI.timer = setTimeout(() => {
    S.aiStep(G);
    UI.disc = [0, 0, 0, 0, 0, 0];
    render(); schedule();
  }, G.pending ? 450 : 850);
}
function after(r) {
  if (!r.ok) { UI.err = r.err || ''; render(); return; }
  UI.err = ''; UI.sel = []; UI.modal = null; UI.disc = [0, 0, 0, 0, 0, 0];
  render(); schedule();
}

$app.addEventListener('input', (e) => { if (e.target.id === 'nm') { UI.name = e.target.value; } });
$app.addEventListener('change', (e) => { const t = e.target; if (t.dataset && t.dataset.act === 'lvone') { UI.lvs[+t.dataset.k] = +t.value; render(); } });
$app.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act;
  if (a === 'closem') { if (e.target === t) { UI.modal = null; render(); } return; }
  e.stopPropagation();
  switch (a) {
    case 'n': UI.n = +t.dataset.v; render(); break;
    case 'lvall': UI.lvs = UI.lvs.map(() => +t.dataset.v); render(); break;
    case 'start': startGame(); break;
    case 'rules': UI.modal = { t: 'rules' }; render(); break;
    case 'closem-btn': UI.modal = null; render(); break;
    case 'restart': clearTimeout(UI.timer); G = null; UI.modal = null; render(); break;
    case 'again': startGame(); break;
    case 'pile': {
      if (!isMyTurn()) break;
      const c = +t.dataset.c; const s = UI.sel; UI.err = '';
      if (s.length === 1 && s[0] === c) { if (G.bank[c] >= 4) s.push(c); else UI.err = '더미에 4개 이상 있을 때만 같은 색 2개를 가져올 수 있어요'; }
      else if (s.includes(c)) { UI.sel = s.filter((x) => x !== c); if (s.length === 2 && s[0] === s[1]) UI.sel = []; }
      else if (s.length === 2 && s[0] === s[1]) UI.err = '같은 색 2개를 골랐어요. 취소 후 다시 고르세요';
      else if (s.length >= 3) UI.err = '최대 3개까지 고를 수 있어요';
      else s.push(c);
      render(); break;
    }
    case 'clear': UI.sel = []; UI.err = ''; render(); break;
    case 'take': after(S.takeGems(G, UI.sel.slice())); break;
    case 'card': if (!isMyTurn()) { UI.modal = { t: 'card', lv: +t.dataset.lv, i: +t.dataset.i }; render(); } else { UI.sel = []; UI.modal = { t: 'card', lv: +t.dataset.lv, i: +t.dataset.i }; render(); } break;
    case 'rcard': UI.modal = { t: 'card', res: true, i: +t.dataset.i }; render(); break;
    case 'deck': UI.modal = { t: 'card', deck: true, lv: +t.dataset.lv }; render(); break;
    case 'buy-board': after(S.buy(G, { from: 'board', level: +t.dataset.lv, idx: +t.dataset.i })); break;
    case 'buy-res': after(S.buy(G, { from: 'res', idx: +t.dataset.i })); break;
    case 'res-board': after(S.reserve(G, +t.dataset.lv, +t.dataset.i)); break;
    case 'res-deck': after(S.reserve(G, +t.dataset.lv, -1)); break;
    case 'dplus': UI.disc[+t.dataset.c]++; render(); break;
    case 'dminus': UI.disc[+t.dataset.c]--; render(); break;
    case 'discard': after(S.discard(G, UI.disc.slice())); break;
    case 'noble': after(S.chooseNoble(G, +t.dataset.id)); break;
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && UI.modal && !(G && G.pending)) { UI.modal = null; render(); } });

render();
})();
</script>

</body></html>
